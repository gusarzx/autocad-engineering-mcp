name: package-checks
on: [push, pull_request, workflow_dispatch]
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest -m "not autocad"
      - run: python -m build
# Real AutoCAD tests require an explicitly configured, interactive Windows workstation.
# They are deliberately excluded from hosted CI and are not automatically scheduled.
